name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint PHP
        run: |
          set -e
          find . -name "*.php" -not -path "./.git/*" -print0 | xargs -0 -n1 php -l

      - name: Lint JavaScript
        run: node --check assets/js/main.js

      - name: Intégrité des images (orphelines / références cassées)
        run: php tools/check-images.php
